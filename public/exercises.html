<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercises - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/exercises.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <div id="admin-nav" class="d-none d-flex">
                    <a class="nav-link px-3" href="/admin/images.html">Images</a>
                    <a class="nav-link px-3" href="/admin/users.html">Users</a>
                    <a class="nav-link px-3" href="/admin/results.html">Results</a>
                    <a class="nav-link px-3" href="/admin/logs.html">Logs</a>
                </div>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="active-containers" class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Active Containers</h2>
                <button id="refresh-containers" class="btn btn-outline-primary btn-sm">Refresh</button>
            </div>
            <div id="containers-list" class="list-group"></div>
        </div>

        <div class="mb-4">
            <h2>Available Exercises</h2>
            <div id="exercises-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        </div>
    </div>

    <template id="exercise-template">
        <div class="col">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text description text-muted"></p>
                    <div class="progress-info mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-muted progress-label"></small>
                            <span class="badge bg-secondary status-badge"></span>
                        </div>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <div class="task-list mt-2"></div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-info level"></span>
                        <button class="btn btn-primary btn-sm create-btn">Launch</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="container-template">
        <div class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-1 exercise-name"></h6>
                    <small class="text-muted created-at"></small>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-success btn-sm open-btn" target="_blank">Open</a>
                    <button class="btn btn-danger btn-sm stop-btn">Stop</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        let platformDomain = '';

        checkAuth();

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();

                if (!data.authenticated) {
                    window.location.href = '/';
                    return;
                }

                if (data.user.isAdmin) {
                    document.getElementById('admin-nav').classList.remove('d-none');
                }

                await loadData();
            } catch (error) {
                window.location.href = '/';
            }
        }

        async function loadData() {
            const exercises = await fetchExercises();
            if (exercises) displayExercises(exercises);

            const containers = await fetchContainers();
            if (containers) displayContainers(containers);

            document.getElementById('refresh-containers').addEventListener('click', async () => {
                const c = await fetchContainers();
                if (c) displayContainers(c);
            });
        }

        async function fetchExercises() {
            try {
                const res = await fetch('/api/exercises');
                const data = await res.json();
                return data.exercises;
            } catch (error) {
                console.error('Error fetching exercises:', error);
                return [];
            }
        }

        async function fetchContainers() {
            try {
                const res = await fetch('/api/containers');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return data.containers;
            } catch (error) {
                console.error('Error fetching containers:', error);
                return [];
            }
        }

        function displayExercises(exercises) {
            const grid = document.getElementById('exercises-grid');
            const template = document.getElementById('exercise-template');
            grid.innerHTML = '';

            exercises.forEach(ex => {
                const clone = template.content.cloneNode(true);
                clone.querySelector('.card-title').textContent = ex.name;
                clone.querySelector('.description').textContent = ex.description;
                clone.querySelector('.level').textContent = ex.level;

                const statusBadge = clone.querySelector('.status-badge');
                const progressBar = clone.querySelector('.progress-bar');
                const progressLabel = clone.querySelector('.progress-label');
                const taskList = clone.querySelector('.task-list');

                const pct = ex.tasks_total > 0 ? Math.round((ex.tasks_completed / ex.tasks_total) * 100) : 0;
                progressBar.style.width = pct + '%';
                progressLabel.textContent = `${ex.tasks_completed}/${ex.tasks_total} tasks`;

                if (ex.progress_status === 'completed') {
                    statusBadge.textContent = 'Completed';
                    statusBadge.className = 'badge bg-success';
                    progressBar.className = 'progress-bar bg-success';
                } else if (ex.progress_status === 'in_progress') {
                    statusBadge.textContent = 'In Progress';
                    statusBadge.className = 'badge bg-warning text-dark';
                    progressBar.className = 'progress-bar bg-warning';
                } else {
                    statusBadge.textContent = 'Not Started';
                    statusBadge.className = 'badge bg-secondary';
                }

                if (ex.tasks && ex.tasks.length > 0) {
                    ex.tasks.forEach(task => {
                        const item = document.createElement('div');
                        item.className = 'form-check small';
                        item.innerHTML = `
                            <input class="form-check-input" type="checkbox" ${task.completed ? 'checked' : ''} disabled>
                            <label class="form-check-label ${task.completed ? 'text-decoration-line-through text-muted' : ''}">${task.description}</label>
                        `;
                        taskList.appendChild(item);
                    });
                }

                const createBtn = clone.querySelector('.create-btn');
                createBtn.onclick = () => launchExercise(ex.id);

                grid.appendChild(clone);
            });
        }

        function displayContainers(containers) {
            const containerList = document.getElementById('containers-list');
            const template = document.getElementById('container-template');
            containerList.innerHTML = '';

            if (!containers || containers.length === 0) {
                document.getElementById('active-containers').style.display = 'none';
                return;
            }

            document.getElementById('active-containers').style.display = 'block';
            containers.forEach(container => {
                const clone = template.content.cloneNode(true);
                clone.querySelector('.exercise-name').textContent = container.image_name;
                const createdDate = new Date(container.created_at + 'Z');
                clone.querySelector('.created-at').textContent = createdDate.toLocaleString();

                const openBtn = clone.querySelector('.open-btn');
                openBtn.href = `https://${container.subdomain}.${window.location.hostname.split('.').slice(-2).join('.')}`;

                clone.querySelector('.stop-btn').onclick = () => stopContainer(container.container_id);

                containerList.appendChild(clone);
            });
        }

        async function launchExercise(exerciseId) {
            try {
                const response = await fetch(`/api/containers/launch/${exerciseId}`, { method: 'POST' });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to launch');
                }

                const [exercises, containers] = await Promise.all([fetchExercises(), fetchContainers()]);
                if (exercises) displayExercises(exercises);
                if (containers) displayContainers(containers);
            } catch (error) {
                alert(error.message);
            }
        }

        async function stopContainer(containerId) {
            if (!confirm('Stop this container? Any unsaved progress in the exercise will be lost.')) return;

            try {
                const response = await fetch(`/api/containers/${containerId}/stop`, { method: 'POST' });
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to stop');
                }

                const containers = await fetchContainers();
                if (containers) displayContainers(containers);
            } catch (error) {
                alert(error.message);
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }
    </script>
</body>
</html>
