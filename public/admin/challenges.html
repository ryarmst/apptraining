<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Status - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .task-badge { cursor: default; font-size: .8rem; }
        .task-badge.done { cursor: pointer; }
        .task-badge.done:hover { opacity: .85; }
        .progress-thin { height: 4px; }
        .refresh-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #198754; margin-right: 4px; animation: pulse 2s infinite; }
        .instance-card.unsolved { border-left: 4px solid #ffc107; }
        .instance-card.solved { border-left: 4px solid #198754; }
        .instance-meta { font-size: .875rem; }
        .task-table td { vertical-align: middle; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/admin/images.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <a class="nav-link px-3" href="/admin/images.html">Images</a>
                <a class="nav-link active px-3" href="/admin/challenges.html">Challenges</a>
                <a class="nav-link px-3" href="/admin/logs.html">Logs</a>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 id="page-title">Challenge Status</h2>
            <div class="d-flex align-items-center gap-3">
                <small class="text-muted"><span class="refresh-dot"></span>Auto-refreshes every 10s</small>
                <button class="btn btn-sm btn-outline-success" onclick="exportCsv()">Export CSV</button>
                <button class="btn btn-sm btn-outline-primary" onclick="loadData()">Refresh Now</button>
            </div>
        </div>

        <div id="summary-card" class="card shadow-sm mb-3 d-none">
            <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h5 class="mb-1" id="summary-fraction">0/0 solved</h5>
                    <small class="text-muted" id="summary-detail">No challenge instances yet.</small>
                </div>
                <div class="progress flex-grow-1 progress-thin" style="min-width: 180px; max-width: 420px;">
                    <div id="summary-progress" class="progress-bar bg-success" style="width:0%"></div>
                </div>
            </div>
        </div>

        <div id="no-containers" class="alert alert-info d-none">
            No challenge instances found. Launch an instance from the <a href="/admin/images.html">Images</a> page.
        </div>

        <div id="instances-container"></div>
    </div>

    <!-- Evidence Modal -->
    <div class="modal fade" id="evidenceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Task Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="evidence-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const imageId = params.get('imageId');
        let currentInstances = [];
        let evidenceItems = [];

        checkAdminAuth();

        async function checkAdminAuth() {
            try {
                const r = await fetch('/api/auth/check');
                const d = await r.json();
                if (!d.authenticated || !d.user.isAdmin) { window.location.href = '/'; return; }
                loadData();
            } catch (e) { window.location.href = '/'; }
        }

        async function loadData() {
            try {
                const url = '/api/admin/challenges' + (imageId ? `?imageId=${imageId}` : '');
                const r = await fetch(url);
                const d = await r.json();
                render(d.exercises || []);
            } catch (e) { console.error('Error loading challenges:', e); }
        }

        function render(exercises) {
            if (imageId && exercises.length === 1) {
                document.getElementById('page-title').textContent =
                    `Challenge Status: ${exercises[0].name}`;
            }

            currentInstances = exercises
                .flatMap(ex => ex.containers.map(c => ({ exercise: ex, container: c })))
                .sort((a, b) => {
                    if (a.container.solved !== b.container.solved) return a.container.solved ? 1 : -1;
                    if (a.container.solved && b.container.solved) {
                        return new Date(b.container.solved_at).getTime() - new Date(a.container.solved_at).getTime();
                    }
                    const aProgress = progressRatio(a.container);
                    const bProgress = progressRatio(b.container);
                    if (aProgress !== bProgress) return bProgress - aProgress;
                    return new Date(b.container.created_at).getTime() - new Date(a.container.created_at).getTime();
                });

            const noContainers = document.getElementById('no-containers');
            const summaryCard = document.getElementById('summary-card');
            const instancesContainer = document.getElementById('instances-container');

            if (currentInstances.length === 0) {
                noContainers.classList.remove('d-none');
                summaryCard.classList.add('d-none');
                instancesContainer.innerHTML = '';
                return;
            }

            noContainers.classList.add('d-none');
            summaryCard.classList.remove('d-none');

            const solvedCount = currentInstances.filter(row => row.container.solved).length;
            const pct = Math.round((solvedCount / currentInstances.length) * 100);
            document.getElementById('summary-fraction').textContent = `${solvedCount}/${currentInstances.length} instances solved (${pct}%)`;
            document.getElementById('summary-detail').textContent =
                `${currentInstances.length - solvedCount} unsolved instance${currentInstances.length - solvedCount === 1 ? '' : 's'} shown first`;
            document.getElementById('summary-progress').style.width = `${pct}%`;
            evidenceItems = [];
            instancesContainer.innerHTML = currentInstances.map(renderInstance).join('');
        }

        function renderInstance(row) {
            const ex = row.exercise;
            const c = row.container;
            const port = window.location.port ? ':' + window.location.port : '';
            const url = `${window.location.protocol}//${c.url}${port}`;
            const pct = Math.round(progressRatio(c) * 100);
            const statusBadge = c.solved
                ? '<span class="badge bg-success">Completed</span>'
                : c.status === 'running'
                    ? '<span class="badge bg-primary">Running</span>'
                    : '<span class="badge bg-secondary">Stopped</span>';
            const taskRows = c.tasks.length
                ? c.tasks.map(t => renderTaskRow(t, c)).join('')
                : `<tr><td colspan="6" class="text-muted">No tasks defined for this exercise.</td></tr>`;

            return `
                <div class="card shadow mb-4 instance-card ${c.solved ? 'solved' : 'unsolved'}">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                            <div>
                                <h5 class="mb-1">${escHtml(ex.name)}</h5>
                                <div class="instance-meta text-muted">
                                    <span class="badge bg-info me-2">${escHtml(ex.level)}</span>
                                    ${statusBadge}
                                    ${!imageId ? `<a href="/admin/challenges.html?imageId=${ex.id}" class="ms-2 text-decoration-none">view only this exercise</a>` : ''}
                                </div>
                            </div>
                            <div class="text-end instance-meta">
                                <div><strong>Progress:</strong> ${c.tasks_completed}/${c.tasks_total} (${pct}%)</div>
                                <div class="progress progress-thin mt-1 mb-1" style="width: 180px;">
                                    <div class="progress-bar ${c.solved ? 'bg-success' : 'bg-primary'}" style="width:${pct}%"></div>
                                </div>
                                ${c.status === 'running' ? `<button onclick="stopContainer('${c.container_id}')" class="btn btn-danger btn-sm mt-1">Stop Instance</button>` : ''}
                            </div>
                        </div>
                        <div class="row g-2 mt-2 instance-meta">
                            <div class="col-md-4"><strong>Instance:</strong> <a href="${url}" target="_blank" class="font-monospace text-decoration-none">${escHtml(c.url)}</a></div>
                            <div class="col-md-2"><strong>Started:</strong> ${formatDate(c.created_at)}</div>
                            <div class="col-md-2"><strong>Solved:</strong> ${c.solved ? 'Yes' : 'No'}</div>
                            <div class="col-md-2"><strong>Solved At:</strong> ${c.solved_at ? formatDate(c.solved_at) : '-'}</div>
                            <div class="col-md-2"><strong>Time:</strong> ${c.solve_duration_minutes !== null ? formatDuration(c.solve_duration_minutes) : '-'}</div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover task-table mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 140px;">Task Status</th>
                                        <th>Exercise Task</th>
                                        <th>Hint</th>
                                        <th style="width: 190px;">Completed At</th>
                                        <th style="width: 140px;">Time Into Exercise</th>
                                        <th style="width: 110px;">Evidence</th>
                                    </tr>
                                </thead>
                                <tbody>${taskRows}</tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
        }

        function renderTaskRow(task, container) {
            const completedAt = task.completed_at ? new Date(task.completed_at) : null;
            const elapsedMinutes = completedAt
                ? Math.max(0, Math.round((completedAt.getTime() - new Date(container.created_at).getTime()) / 60000))
                : null;
            let evidenceButton = '-';
            if (task.completed) {
                const evidenceIndex = evidenceItems.push(task) - 1;
                evidenceButton = `<button onclick="showEvidenceByIndex(${evidenceIndex})" class="btn btn-outline-secondary btn-sm">Details</button>`;
            }

            return `
                <tr class="${task.completed ? '' : 'table-warning'}">
                    <td>${task.completed ? '<span class="badge bg-success">Complete</span>' : '<span class="badge bg-secondary">Pending</span>'}</td>
                    <td>${escHtml(task.description)}</td>
                    <td><small class="text-muted">${escHtml(task.hint || '')}</small></td>
                    <td>${completedAt ? formatDate(completedAt) : '-'}</td>
                    <td>${elapsedMinutes !== null ? formatDuration(elapsedMinutes) : '-'}</td>
                    <td>${evidenceButton}</td>
                </tr>`;
        }

        function progressRatio(c) {
            return c.tasks_total > 0 ? c.tasks_completed / c.tasks_total : 0;
        }

        function showEvidenceByIndex(index) {
            const t = evidenceItems[index];
            if (!t) return;
            let evidenceHtml = '<p class="text-muted mb-0">No evidence recorded.</p>';
            if (t.evidence) {
                let parsed = t.evidence;
                try { parsed = JSON.parse(t.evidence); } catch (e) { /* raw string */ }
                evidenceHtml = `<pre class="bg-light p-2 rounded small mb-0">${escHtml(JSON.stringify(parsed, null, 2))}</pre>`;
            }
            document.getElementById('evidence-body').innerHTML = `
                <dl class="mb-2">
                    <dt>Task</dt><dd>${escHtml(t.description)}</dd>
                    <dt>Completed</dt><dd>${new Date(t.completed_at).toLocaleString()}</dd>
                    ${t.hint ? `<dt>Hint</dt><dd class="text-muted">${escHtml(t.hint)}</dd>` : ''}
                </dl>
                <dt>Evidence</dt>
                ${evidenceHtml}
            `;
            new bootstrap.Modal(document.getElementById('evidenceModal')).show();
        }

        function formatDate(value) {
            return value ? new Date(value).toLocaleString() : '-';
        }

        function formatDuration(minutes) {
            if (minutes < 60) return `${minutes}m`;
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return mins ? `${hours}h ${mins}m` : `${hours}h`;
        }

        function exportCsv() {
            const headers = [
                'exercise',
                'level',
                'instance_url',
                'instance_status',
                'instance_solved',
                'instance_tasks_completed',
                'instance_tasks_total',
                'started_at',
                'solved_at',
                'solve_duration_minutes',
                'task_id',
                'task_description',
                'task_completed',
                'task_completed_at',
                'task_elapsed_minutes',
                'task_hint'
            ];
            const rows = currentInstances.flatMap(({ exercise, container }) => {
                const tasks = container.tasks.length ? container.tasks : [{
                    id: '',
                    description: '',
                    completed: false,
                    completed_at: null,
                    hint: ''
                }];

                return tasks.map(task => {
                    const taskElapsed = task.completed_at
                        ? Math.max(0, Math.round((new Date(task.completed_at).getTime() - new Date(container.created_at).getTime()) / 60000))
                        : '';

                    return [
                        exercise.name,
                        exercise.level,
                        container.url,
                        container.status,
                        container.solved ? 'yes' : 'no',
                        container.tasks_completed,
                        container.tasks_total,
                        container.created_at,
                        container.solved_at || '',
                        container.solve_duration_minutes ?? '',
                        task.id,
                        task.description,
                        task.completed ? 'yes' : 'no',
                        task.completed_at || '',
                        taskElapsed,
                        task.hint || ''
                    ];
                });
            });
            const csv = [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `challenge-results-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function csvCell(value) {
            const text = String(value ?? '');
            return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function stopContainer(id) {
            if (!confirm('Stop this container?')) return;
            try {
                const r = await fetch(`/api/admin/containers/${id}/stop`, { method: 'POST' });
                if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Stop failed'); }
                loadData();
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        setInterval(loadData, 10000);
    </script>
</body>
</html>
