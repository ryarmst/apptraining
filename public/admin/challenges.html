<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Status - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .task-badge { cursor: default; font-size: .8rem; }
        .task-badge.done { cursor: pointer; }
        .task-badge.done:hover { opacity: .85; }
        .container-row { border-left: 3px solid #0d6efd; padding-left: .75rem; margin-bottom: .75rem; }
        .container-row.all-done { border-left-color: #198754; }
        .progress-thin { height: 4px; }
        .refresh-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #198754; margin-right: 4px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/admin/images.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <a class="nav-link px-3" href="/admin/images.html">Images</a>
                <a class="nav-link active px-3" href="/admin/challenges.html">Challenges</a>
                <a class="nav-link px-3" href="/admin/logs.html">Logs</a>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 id="page-title">Challenge Status</h2>
            <div class="d-flex align-items-center gap-3">
                <small class="text-muted"><span class="refresh-dot"></span>Auto-refreshes every 10s</small>
                <button class="btn btn-sm btn-outline-primary" onclick="loadData()">Refresh Now</button>
            </div>
        </div>

        <div id="no-containers" class="alert alert-info d-none">
            No active instances found. Launch an instance from the <a href="/admin/images.html">Images</a> page.
        </div>

        <div id="exercises-container"></div>
    </div>

    <!-- Evidence Modal -->
    <div class="modal fade" id="evidenceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Task Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="evidence-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const imageId = params.get('imageId');

        checkAdminAuth();

        async function checkAdminAuth() {
            try {
                const r = await fetch('/api/auth/check');
                const d = await r.json();
                if (!d.authenticated || !d.user.isAdmin) { window.location.href = '/'; return; }
                loadData();
            } catch (e) { window.location.href = '/'; }
        }

        async function loadData() {
            try {
                const url = '/api/admin/challenges' + (imageId ? `?imageId=${imageId}` : '');
                const r = await fetch(url);
                const d = await r.json();
                render(d.exercises || []);
            } catch (e) { console.error('Error loading challenges:', e); }
        }

        function render(exercises) {
            // Filter to exercises that have containers
            const active = exercises.filter(ex => ex.containers.length > 0);

            // Update page title for single-exercise view
            if (imageId && exercises.length === 1) {
                document.getElementById('page-title').textContent =
                    `Challenge Status: ${exercises[0].name}`;
            }

            const noContainers = document.getElementById('no-containers');
            if (active.length === 0) {
                noContainers.classList.remove('d-none');
                document.getElementById('exercises-container').innerHTML = '';
                return;
            }
            noContainers.classList.add('d-none');

            document.getElementById('exercises-container').innerHTML = active.map(ex => `
                <div class="card shadow mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0 d-inline">${ex.name}</h5>
                            <span class="badge bg-info ms-2">${ex.level}</span>
                            ${!imageId ? `<a href="/admin/challenges.html?imageId=${ex.id}" class="ms-2 small text-decoration-none">view only this</a>` : ''}
                        </div>
                        <small class="text-muted">${ex.containers.length} instance${ex.containers.length !== 1 ? 's' : ''}</small>
                    </div>
                    <div class="card-body pb-1">
                        ${ex.containers.map(c => renderContainer(c, ex)).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderContainer(c, ex) {
            const protocol = window.location.protocol;
            const port = window.location.port ? ':' + window.location.port : '';
            const url = `${protocol}//${c.url}${port}`;
            const allDone = c.tasks_total > 0 && c.tasks_completed >= c.tasks_total;
            const pct = c.tasks_total > 0 ? Math.round(c.tasks_completed / c.tasks_total * 100) : 0;
            const elapsed = Math.floor((Date.now() - new Date(c.created_at).getTime()) / 60000);
            const statusBadge = allDone
                ? '<span class="badge bg-success">Completed</span>'
                : c.status === 'running'
                    ? '<span class="badge bg-primary">Running</span>'
                    : '<span class="badge bg-secondary">Stopped</span>';

            const taskPills = c.tasks.map(t => {
                const cls = t.completed ? 'bg-success done' : 'bg-secondary';
                const onclick = t.completed
                    ? `onclick="showEvidence(${JSON.stringify(JSON.stringify(t))})"`
                    : '';
                const title = t.completed
                    ? `Completed: ${new Date(t.completed_at).toLocaleString()}${t.evidence ? ' (click for evidence)' : ''}`
                    : `Pending: ${t.description}`;
                return `<span class="badge ${cls} task-badge me-1 mb-1" ${onclick} title="${escHtml(title)}">
                    ${t.completed ? '&#10003;' : '&#9679;'} ${escHtml(t.description)}
                </span>`;
            }).join('');

            return `
                <div class="container-row ${allDone ? 'all-done' : ''} py-2">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <a href="${url}" target="_blank" class="font-monospace small text-decoration-none">${c.url}</a>
                            <span class="ms-2">${statusBadge}</span>
                            <span class="ms-2 text-muted small">${elapsed}m ago</span>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <div class="text-end">
                                <small class="text-muted">${c.tasks_completed}/${c.tasks_total} tasks</small>
                                <div class="progress progress-thin mt-1" style="width:100px">
                                    <div class="progress-bar ${allDone ? 'bg-success' : 'bg-primary'}" style="width:${pct}%"></div>
                                </div>
                            </div>
                            ${c.status === 'running' ? `<button onclick="stopContainer('${c.container_id}')" class="btn btn-danger btn-sm">Stop</button>` : ''}
                        </div>
                    </div>
                    <div class="mt-2">${taskPills || '<small class="text-muted">No tasks defined</small>'}</div>
                </div>`;
        }

        function showEvidence(taskJson) {
            const t = JSON.parse(taskJson);
            let evidenceHtml = '<p class="text-muted mb-0">No evidence recorded.</p>';
            if (t.evidence) {
                let parsed = t.evidence;
                try { parsed = JSON.parse(t.evidence); } catch (e) { /* raw string */ }
                evidenceHtml = `<pre class="bg-light p-2 rounded small mb-0">${escHtml(JSON.stringify(parsed, null, 2))}</pre>`;
            }
            document.getElementById('evidence-body').innerHTML = `
                <dl class="mb-2">
                    <dt>Task</dt><dd>${escHtml(t.description)}</dd>
                    <dt>Completed</dt><dd>${new Date(t.completed_at).toLocaleString()}</dd>
                    ${t.hint ? `<dt>Hint</dt><dd class="text-muted">${escHtml(t.hint)}</dd>` : ''}
                </dl>
                <dt>Evidence</dt>
                ${evidenceHtml}
            `;
            new bootstrap.Modal(document.getElementById('evidenceModal')).show();
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function stopContainer(id) {
            if (!confirm('Stop this container?')) return;
            try {
                const r = await fetch(`/api/admin/containers/${id}/stop`, { method: 'POST' });
                if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Stop failed'); }
                loadData();
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        setInterval(loadData, 10000);
    </script>
</body>
</html>
