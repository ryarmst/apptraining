<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Management - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/exercises.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <a class="nav-link active px-3" href="/admin/images.html">Images</a>
                <a class="nav-link px-3" href="/admin/users.html">Users</a>
                <a class="nav-link px-3" href="/admin/results.html">Results</a>
                <a class="nav-link px-3" href="/admin/logs.html">Logs</a>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow mb-4">
            <div class="card-header"><h5 class="mb-0">Upload Exercise</h5></div>
            <div class="card-body">
                <div id="error-message" class="alert alert-danger d-none"></div>
                <div id="success-message" class="alert alert-success d-none"></div>

                <form id="image-upload-form" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="exercise" class="form-label">Exercise Package (.tar, .tar.gz, .tgz, or .zip)</label>
                        <input type="file" class="form-control" id="exercise" name="exercise" accept=".tar,.tar.gz,.tgz,.zip" required>
                        <div class="form-text">Max 50MB. Name, description, level, and tasks are read from metadata.json.</div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="upload-btn">Upload Exercise</button>
                </form>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Exercise Images</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="fetchHealth()">Check Docker Health</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Level</th>
                                <th>Tasks</th>
                                <th>Docker</th>
                                <th>Active</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="images-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        checkAdminAuth();

        async function checkAdminAuth() {
            try {
                const r = await fetch('/api/auth/check');
                const d = await r.json();
                if (!d.authenticated || !d.user.isAdmin) { window.location.href = '/'; return; }
                fetchImages();
            } catch (e) { window.location.href = '/'; }
        }

        document.getElementById('image-upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const btn = document.getElementById('upload-btn');
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            btn.disabled = true;
            btn.textContent = 'Uploading & Building...';

            const formData = new FormData();
            formData.append('exercise', document.getElementById('exercise').files[0]);

            try {
                const response = await fetch('/api/exercises/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Upload failed');

                successDiv.textContent = `Exercise "${data.image.name}" uploaded successfully (${data.image.tasks} tasks defined)`;
                successDiv.classList.remove('d-none');
                document.getElementById('image-upload-form').reset();
                fetchImages();
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload Exercise';
            }
        });

        let healthData = {};

        async function fetchImages() {
            try {
                const response = await fetch('/api/exercises');
                const data = await response.json();
                displayImages(data.exercises || []);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function fetchHealth() {
            try {
                const response = await fetch('/api/admin/images/health');
                const data = await response.json();
                healthData = {};
                (data.images || []).forEach(img => { healthData[img.id] = img; });
                fetchImages();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayImages(images) {
            const tbody = document.getElementById('images-table-body');
            tbody.innerHTML = images.map(img => {
                const health = healthData[img.id];
                const dockerBadge = health
                    ? (health.docker_status === 'available'
                        ? `<span class="badge bg-success">Available</span>`
                        : `<span class="badge bg-danger">Missing</span>`)
                    : '<span class="badge bg-secondary">Unknown</span>';
                const activeCount = health ? health.active_containers : '?';
                const sizeStr = health && health.size ? (health.size / 1024 / 1024).toFixed(1) + ' MB' : '';

                return `<tr>
                    <td><strong>${img.name}</strong><br><small class="text-muted">v${img.version || '?'}</small></td>
                    <td><small>${img.description || ''}</small></td>
                    <td><span class="badge bg-info">${img.level}</span></td>
                    <td>${img.tasks_total} tasks</td>
                    <td>${dockerBadge} ${sizeStr ? '<br><small class="text-muted">' + sizeStr + '</small>' : ''}</td>
                    <td>${activeCount}</td>
                    <td><button onclick="deleteImage(${img.id})" class="btn btn-danger btn-sm">Delete</button></td>
                </tr>`;
            }).join('');
        }

        async function deleteImage(imageId) {
            if (!confirm('Delete this exercise and all associated progress data?')) return;
            try {
                const response = await fetch(`/api/exercises/${imageId}`, { method: 'DELETE' });
                if (!response.ok) {
                    const d = await response.json();
                    throw new Error(d.error || 'Delete failed');
                }
                fetchImages();
            } catch (error) {
                alert(error.message);
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }
    </script>
</body>
</html>
