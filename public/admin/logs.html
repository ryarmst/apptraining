<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/admin/images.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <a class="nav-link px-3" href="/admin/images.html">Images</a>
                <a class="nav-link px-3" href="/admin/challenges.html">Challenges</a>
                <a class="nav-link active px-3" href="/admin/logs.html">Logs</a>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="mb-4">
            <h2>Active Sessions</h2>
            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead><tr>
                        <th>User</th><th>IP</th><th>Started</th><th>Last Activity</th><th>Actions</th>
                    </tr></thead>
                    <tbody id="sessions-table"></tbody>
                </table>
            </div>
        </div>

        <div class="mb-4">
            <h2>Running Containers</h2>
            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead><tr>
                        <th>Exercise</th><th>Started</th><th>Uptime</th><th>Access URL</th><th>Actions</th>
                    </tr></thead>
                    <tbody id="containers-table"></tbody>
                </table>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h2>System Logs</h2>
                <select id="event-filter" class="form-select form-select-sm" style="width: auto;">
                    <option value="">All Events</option>
                    <option value="login_success">Login</option>
                    <option value="container_created">Container Created</option>
                    <option value="container_stopped">Container Stopped</option>
                    <option value="task_completed">Task Completed</option>
                    <option value="exercise_completed">Exercise Completed</option>
                </select>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead><tr>
                        <th style="min-width:160px">Time</th><th>Event</th><th>Details</th>
                    </tr></thead>
                    <tbody id="logs-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        checkAdminAuth();

        async function checkAdminAuth() {
            try {
                const r = await fetch('/api/auth/check');
                const d = await r.json();
                if (!d.authenticated || !d.user.isAdmin) { window.location.href = '/'; return; }
                fetchData();
            } catch (e) { window.location.href = '/'; }
        }

        async function fetchData() {
            try {
                const [sessR, contR, logsR] = await Promise.all([
                    fetch('/api/admin/sessions'),
                    fetch('/api/admin/containers'),
                    fetch('/api/admin/logs' + (document.getElementById('event-filter').value ? '?event_type=' + document.getElementById('event-filter').value : ''))
                ]);
                const [sessD, contD, logsD] = await Promise.all([sessR.json(), contR.json(), logsR.json()]);
                displaySessions(sessD.sessions || []);
                displayContainers(contD.containers || []);
                displayLogs(logsD.logs || []);
            } catch (e) { console.error('Error:', e); }
        }

        document.getElementById('event-filter').addEventListener('change', fetchData);

        function displaySessions(sessions) {
            const tbody = document.getElementById('sessions-table');
            tbody.innerHTML = sessions.map(s => `
                <tr>
                    <td>${s.username} ${s.user_role === 'admin' ? '<span class="badge bg-warning">Admin</span>' : ''}</td>
                    <td>${s.ip_address || ''}</td>
                    <td>${new Date(s.created_at).toLocaleString()}</td>
                    <td>${new Date(s.last_activity).toLocaleString()}</td>
                    <td><button onclick="terminateSession('${s.session_id}')" class="btn btn-sm btn-danger" ${s.user_role === 'admin' ? 'disabled' : ''}>Terminate</button></td>
                </tr>
            `).join('');
        }

        function buildContainerUrl(subdomain) {
            const protocol = window.location.protocol;
            const port = window.location.port ? ':' + window.location.port : '';
            return `${protocol}//${subdomain}${port}`;
        }

        function displayContainers(containers) {
            const tbody = document.getElementById('containers-table');
            tbody.innerHTML = containers.map(c => {
                const elapsed = Date.now() - new Date(c.created_at).getTime();
                const mins = Math.floor(elapsed / 60000);
                const url = buildContainerUrl(c.subdomain + '.' + window.location.hostname.split('.').slice(-2).join('.'));
                return `<tr>
                    <td>${c.exercise_name} <span class="badge bg-info">${c.level}</span></td>
                    <td>${new Date(c.created_at).toLocaleString()}</td>
                    <td>${mins}m</td>
                    <td>
                        <div class="input-group input-group-sm" style="min-width:280px">
                            <input type="text" class="form-control font-monospace" value="${url}" readonly id="url-${c.container_id}">
                            <button class="btn btn-outline-secondary" onclick="copyContainerUrl('${c.container_id}')" title="Copy">Copy</button>
                        </div>
                    </td>
                    <td>
                        <button onclick="stopContainer('${c.container_id}')" class="btn btn-sm btn-danger">Stop</button>
                        <a href="${url}" target="_blank" class="btn btn-sm btn-outline-primary">Open</a>
                    </td>
                </tr>`;
            }).join('');
        }

        function copyContainerUrl(containerId) {
            const input = document.getElementById('url-' + containerId);
            input.select();
            navigator.clipboard.writeText(input.value).catch(() => document.execCommand('copy'));
        }

        function displayLogs(logs) {
            const tbody = document.getElementById('logs-table');
            tbody.innerHTML = logs.map(l => {
                let details = {};
                try { details = JSON.parse(l.details || '{}'); } catch(e) {}
                return `<tr>
                    <td>${new Date(l.created_at).toLocaleString()}</td>
                    <td><span class="badge bg-dark">${l.event_type}</span></td>
                    <td><small><code>${JSON.stringify(details)}</code></small></td>
                </tr>`;
            }).join('');
        }

        async function terminateSession(id) {
            if (!confirm('Terminate this session?')) return;
            await fetch(`/api/admin/sessions/${id}/terminate`, { method: 'POST' });
            fetchData();
        }

        async function stopContainer(id) {
            if (!confirm('Stop this container?')) return;
            await fetch(`/api/admin/containers/${id}/stop`, { method: 'POST' });
            fetchData();
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        setInterval(fetchData, 30000);
    </script>
</body>
</html>
