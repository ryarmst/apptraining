<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/exercises.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <a class="nav-link px-3" href="/admin/images.html">Images</a>
                <a class="nav-link active px-3" href="/admin/users.html">Users</a>
                <a class="nav-link px-3" href="/admin/results.html">Results</a>
                <a class="nav-link px-3" href="/admin/logs.html">Logs</a>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header"><h5 class="mb-0">User Management</h5></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Created</th>
                                <th>Progress</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        checkAdminAuth();

        async function checkAdminAuth() {
            try {
                const r = await fetch('/api/auth/check');
                const d = await r.json();
                if (!d.authenticated || !d.user.isAdmin) { window.location.href = '/'; return; }
                fetchUsers();
            } catch (e) { window.location.href = '/'; }
        }

        async function fetchUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();
                displayUsers(data.users || []);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayUsers(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td><strong>${user.username}</strong></td>
                    <td>${user.isAdmin ? '<span class="badge bg-warning">Admin</span>' : '<span class="badge bg-secondary">User</span>'}</td>
                    <td>${new Date(user.createdAt).toLocaleString()}</td>
                    <td>${!user.isAdmin ? `<a href="/admin/results.html" class="btn btn-sm btn-outline-info">View</a>` : ''}</td>
                    <td>${!user.isAdmin ? `<button onclick="deleteUser('${user.id}')" class="btn btn-danger btn-sm">Delete</button>` : ''}</td>
                </tr>
            `).join('');
        }

        async function deleteUser(userId) {
            if (!confirm('Delete this user? This will stop their running containers and remove all progress data.')) return;
            try {
                const response = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Delete failed');
                fetchUsers();
            } catch (error) {
                alert(error.message);
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        fetchUsers();
    </script>
</body>
</html>
