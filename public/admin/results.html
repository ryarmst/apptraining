<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Security Training Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/exercises.html">Security Training Platform</a>
            <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <a class="nav-link px-3" href="/admin/images.html">Images</a>
                <a class="nav-link px-3" href="/admin/users.html">Users</a>
                <a class="nav-link active px-3" href="/admin/results.html">Results</a>
                <a class="nav-link px-3" href="/admin/logs.html">Logs</a>
                <button onclick="logout()" class="btn btn-outline-light ms-2">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Training Results</h2>
            <div id="stats" class="d-flex gap-3"></div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header"><h5 class="mb-0">Overview</h5></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>User</th>
                                <th id="exercise-headers"></th>
                            </tr>
                        </thead>
                        <tbody id="results-table"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="user-detail" class="card shadow d-none">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Detail: <span id="detail-username"></span></h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="hideDetail()">Close</button>
            </div>
            <div class="card-body" id="detail-body"></div>
        </div>
    </div>

    <script>
        checkAdminAuth();

        async function checkAdminAuth() {
            try {
                const r = await fetch('/api/auth/check');
                const d = await r.json();
                if (!d.authenticated || !d.user.isAdmin) { window.location.href = '/'; return; }
                loadData();
            } catch (e) { window.location.href = '/'; }
        }

        async function loadData() {
            try {
                const [statsR, resultsR] = await Promise.all([
                    fetch('/api/admin/stats'),
                    fetch('/api/admin/results')
                ]);
                const [statsD, resultsD] = await Promise.all([statsR.json(), resultsR.json()]);

                displayStats(statsD.stats);
                displayResults(resultsD.results);
            } catch (e) { console.error('Error:', e); }
        }

        function displayStats(stats) {
            document.getElementById('stats').innerHTML = `
                <span class="badge bg-primary fs-6">${stats.total_users} Users</span>
                <span class="badge bg-info fs-6">${stats.total_exercises} Exercises</span>
                <span class="badge bg-success fs-6">${stats.total_completions} Completions</span>
                <span class="badge bg-warning text-dark fs-6">${stats.active_containers} Active</span>
            `;
        }

        function displayResults(results) {
            if (!results || results.length === 0) {
                document.getElementById('results-table').innerHTML = '<tr><td colspan="99" class="text-center text-muted">No users yet</td></tr>';
                return;
            }

            const exercises = results[0]?.exercises || [];
            const headerRow = document.querySelector('#exercise-headers').parentElement;
            document.getElementById('exercise-headers').remove();
            exercises.forEach(ex => {
                const th = document.createElement('th');
                th.textContent = ex.exercise_name;
                th.className = 'text-center';
                headerRow.appendChild(th);
            });

            const tbody = document.getElementById('results-table');
            tbody.innerHTML = results.map(user => {
                const cells = user.exercises.map(ex => {
                    const pct = ex.tasks_total > 0 ? Math.round((ex.tasks_completed / ex.tasks_total) * 100) : 0;
                    let colorClass = 'bg-secondary';
                    if (ex.status === 'completed') colorClass = 'bg-success';
                    else if (ex.status === 'in_progress') colorClass = 'bg-warning text-dark';

                    return `<td class="text-center">
                        <span class="badge ${colorClass}">${ex.tasks_completed}/${ex.tasks_total}</span>
                        <div class="progress mt-1" style="height:4px">
                            <div class="progress-bar ${ex.status === 'completed' ? 'bg-success' : 'bg-warning'}" style="width:${pct}%"></div>
                        </div>
                    </td>`;
                }).join('');

                return `<tr style="cursor:pointer" onclick="showDetail(${user.user_id})">
                    <td><strong>${user.username}</strong></td>
                    ${cells}
                </tr>`;
            }).join('');
        }

        async function showDetail(userId) {
            try {
                const r = await fetch(`/api/admin/users/${userId}/progress`);
                const d = await r.json();

                document.getElementById('detail-username').textContent = d.user.username;
                const body = document.getElementById('detail-body');

                body.innerHTML = d.progress.map(ex => `
                    <div class="mb-3">
                        <h6>${ex.exercise_name} <span class="badge bg-info">${ex.level}</span>
                            <span class="badge ${ex.status === 'completed' ? 'bg-success' : ex.status === 'in_progress' ? 'bg-warning text-dark' : 'bg-secondary'}">${ex.status}</span>
                        </h6>
                        <small class="text-muted">Attempts: ${ex.attempts} | Launches: ${ex.container_launches}</small>
                        ${ex.tasks.length > 0 ? `<ul class="list-group list-group-flush mt-1">
                            ${ex.tasks.map(t => `
                                <li class="list-group-item py-1 d-flex justify-content-between align-items-center">
                                    <span>${t.completed ? '<s>' : ''}${t.description}${t.completed ? '</s>' : ''}</span>
                                    ${t.completed ? `<span class="badge bg-success">${new Date(t.completed_at).toLocaleString()}</span>` : '<span class="badge bg-secondary">Pending</span>'}
                                </li>
                            `).join('')}
                        </ul>` : '<small class="text-muted">No tasks defined</small>'}
                    </div>
                `).join('');

                document.getElementById('user-detail').classList.remove('d-none');
            } catch (e) { console.error('Error:', e); }
        }

        function hideDetail() {
            document.getElementById('user-detail').classList.add('d-none');
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }
    </script>
</body>
</html>
